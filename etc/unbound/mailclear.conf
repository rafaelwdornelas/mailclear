# ════════════════════════════════════════════════════════════════════════
# MailClear — Configuração drop-in do Unbound (recursivo puro)
# Destino: /etc/unbound/unbound.conf.d/mailclear.conf
# Alvo: ~50k req/s sustentadas, cache quente para domínios populares.
# ════════════════════════════════════════════════════════════════════════

server:
    # ── Identidade ────────────────────────────────────────────────────
    verbosity: 0
    use-syslog: no
    log-queries: no
    log-replies: no
    log-servfail: no
    log-local-actions: no
    # Logs de query a 50k req/s são proibitivos. Subir verbosity só em debug.

    # ── Bind (apenas localhost) ───────────────────────────────────────
    # IPv4-only: muitos servidores (Contabo, VPS sem dual-stack) não
    # configuram IPv6, e bindar em ::1 ali derruba o serviço.
    # Para validar emails MX, IPv4 é suficiente — autoritativos respondem.
    # Se sua máquina tiver IPv6, descomente `interface: ::1` e `do-ip6: yes`.
    interface: 127.0.0.1
    # interface: ::1
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # ── Access control ────────────────────────────────────────────────
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow

    # ── Threading ─────────────────────────────────────────────────────
    # 16 threads dá conta da carga gerada pela app com 256 workers × 64
    # paralelos. Slabs em 32 (potência de 2, >= num-threads × 2).
    # Para máquinas com <16 vCPUs, baixar pra 8 + slabs 16.
    num-threads: 16
    msg-cache-slabs: 32
    rrset-cache-slabs: 32
    infra-cache-slabs: 32
    key-cache-slabs: 32

    so-reuseport: yes
    # Cada thread tem socket SO_REUSEPORT (~30% de ganho em UDP).

    so-rcvbuf: 8m
    so-sndbuf: 4m
    # Buffers grandes absorvem bursts. Requer sysctl net.core.rmem_max>=8M
    # (configurado em /etc/sysctl.d/99-mailclear.conf).

    # ── Cache (coração do sistema) ────────────────────────────────────
    rrset-cache-size: 1g
    msg-cache-size: 512m
    # ~1.5GB RAM total. Top-10k domínios cobrem >80% do tráfego.

    cache-min-ttl: 300
    # Mínimo 5 min — ignora TTLs absurdamente curtos (Cloudflare 60s).

    cache-max-ttl: 86400
    # Máximo 24h — pega trocas de MX dos provedores.

    cache-max-negative-ttl: 3600
    # NXDOMAIN em cache 1h — typos de spammer se repetem muito.
    # (cache-min-negative-ttl não existe no Unbound; só cache-max é suportado)

    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-reply-ttl: 30
    serve-expired-client-timeout: 1800
    # Stale-while-revalidate. Para validação de email é aceitável.

    prefetch: yes
    prefetch-key: yes
    # Refresh assíncrono a 90% do TTL. Usuário sempre pega hit.

    # ── EDNS ──────────────────────────────────────────────────────────
    edns-buffer-size: 1232
    # DNS Flag Day 2020. Evita fragmentação UDP.

    # ── Hardening ─────────────────────────────────────────────────────
    qname-minimisation: yes
    qname-minimisation-strict: no
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-referral-path: no
    harden-algo-downgrade: yes
    use-caps-for-id: no
    aggressive-nsec: yes
    minimal-responses: yes

    # ── Recursão / Network ────────────────────────────────────────────
    root-hints: "/var/lib/unbound/root.hints"
    hide-identity: yes
    hide-version: yes
    identity: ""
    version: ""

    # Paralelismo de queries de saída
    outgoing-range: 8192
    num-queries-per-thread: 4096
    outgoing-num-tcp: 100
    incoming-num-tcp: 100
    tcp-upstream: no

    # ── DNSSEC ────────────────────────────────────────────────────────
    # Desabilitado: para validação de email a verificação de assinatura
    # da zona não traz ganho prático e o gerenciamento do trust anchor
    # (root.key) costuma dar problemas em deploys com dns-root-data
    # (anchor duplicado, etc). Para reativar: descomente abaixo e garanta
    # um root.key válido (sem duplicação) em /var/lib/unbound/root.key.
    # auto-trust-anchor-file: "/var/lib/unbound/root.key"
    # val-clean-additional: yes
    # trust-anchor-signaling: yes

    # ── Estatística ───────────────────────────────────────────────────
    statistics-interval: 0
    extended-statistics: yes
    statistics-cumulative: no

# ── remote-control (unbound-control) ─────────────────────────────────────
# Desabilitado intencionalmente. No Ubuntu/Debian o systemd ativa
# ProtectSystem/AppArmor para o serviço unbound, e isso impede o daemon
# de ler /etc/unbound/unbound_server.pem ao subir o canal de controle
# em mTLS — fazendo o serviço falhar com "fatal error: could not set
# up remote-control".
#
# As estatísticas DNS necessárias para operação estão disponíveis no
# endpoint /metrics da própria aplicação MailClear:
#   - dns_query_total{type,result}
#   - dns_cache_hits_total{layer,type}
#   - dns_query_duration_seconds_*
#   - dns_singleflight_total{type}
#
# Para reativar (não recomendado sem ajustar AppArmor):
# remote-control:
#     control-enable: yes
#     control-interface: 127.0.0.1
#     control-port: 8953
#     server-key-file: "/etc/unbound/unbound_server.key"
#     server-cert-file: "/etc/unbound/unbound_server.pem"
#     control-key-file: "/etc/unbound/unbound_control.key"
#     control-cert-file: "/etc/unbound/unbound_control.pem"
