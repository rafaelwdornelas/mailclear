# ════════════════════════════════════════════════════════════════════════
# MailClear — Configuração drop-in do Redis (cache puro, sem persistência)
# Destino: /etc/redis/conf.d/mailclear.conf
# (incluído no redis.conf principal via "include /etc/redis/conf.d/*.conf")
# ════════════════════════════════════════════════════════════════════════

# Bind apenas localhost (a app conecta em 127.0.0.1)
bind 127.0.0.1 -::1
protected-mode yes
port 6379

# ── Memória ──────────────────────────────────────────────────────────
# Limite de 2GB. Ajuste conforme RAM disponível.
maxmemory 2gb

# Eviction LRU em todas as chaves quando atinge o limite.
maxmemory-policy allkeys-lru

# Sample size para aproximação do LRU (5 = bom equilíbrio).
maxmemory-samples 5

# ── Persistência desabilitada (cache puro) ──────────────────────────
# Para usar como cache: zero I/O de disco.
save ""
appendonly no
stop-writes-on-bgsave-error no

# ── Performance ─────────────────────────────────────────────────────
tcp-backlog 4096
tcp-keepalive 300
timeout 0

databases 16

# I/O threads para acelerar serialização (Redis 6+)
io-threads 4
io-threads-do-reads yes

# ── Logs (vão para journalctl via systemd) ──────────────────────────
loglevel notice
syslog-enabled no
logfile ""

# ── Snapshot disabled, AOF disabled ─────────────────────────────────
rdbcompression no
rdbchecksum no

# ── Latência ────────────────────────────────────────────────────────
latency-monitor-threshold 100
