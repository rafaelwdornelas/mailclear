# ════════════════════════════════════════════════════════════════════════
# MailClear — Tuning de kernel para alto throughput de DNS/HTTP
# Destino: /etc/sysctl.d/99-mailclear.conf
# Aplicado com: sudo sysctl --system
# ════════════════════════════════════════════════════════════════════════

# ── Buffers de socket ────────────────────────────────────────────────
# Unbound precisa de so-rcvbuf=8m (configurado em unbound.conf)
net.core.rmem_max = 8388608
net.core.wmem_max = 4194304
net.core.rmem_default = 1048576
net.core.wmem_default = 524288

# ── Backlog de conexões ──────────────────────────────────────────────
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 8192
net.ipv4.tcp_max_syn_backlog = 4096

# ── Range de portas efêmeras (mais conexões simultâneas) ─────────────
net.ipv4.ip_local_port_range = 10000 65535

# ── TIME-WAIT reuse para curto turn-around ───────────────────────────
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# ── UDP / DNS ────────────────────────────────────────────────────────
# Aumenta limite de memória global para sockets UDP
net.ipv4.udp_mem = 102400 873800 16777216
net.ipv4.udp_rmem_min = 8192
net.ipv4.udp_wmem_min = 8192

# ── Limites de arquivo (file descriptors) ────────────────────────────
fs.file-max = 2097152
fs.nr_open = 2097152
